<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tips & Bling | Luxury Press-On Nails</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#fdf8f6] text-neutral-800 font-['Plus_Jakarta_Sans',sans-serif]">

    <!-- Header -->
    <header class="bg-white border-b border-[#f5dcd3] sticky top-0 z-40 py-4 px-6 flex items-center justify-between shadow-sm">
        <h1 class="font-['Playfair_Display',serif] text-2xl font-bold tracking-wider text-[#6a3222]">TIPS & BLING</h1>
        <button onclick="toggleBag()" class="relative text-[#6a3222] p-2">
            <i class="fa-solid fa-bag-shopping text-xl"></i>
            <span id="bag-count" class="absolute -top-1 -right-1 bg-[#b85d43] text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
    </header>

    <!-- Hero -->
    <section class="max-w-4xl mx-auto px-6 py-12 text-center">
        <span class="bg-[#fbeee9] text-[#813d29] text-xs font-bold px-4 py-1.5 rounded-full uppercase tracking-widest">Handcrafted Luxury</span>
        <h2 class="font-['Playfair_Display',serif] text-4xl sm:text-5xl font-bold text-neutral-900 mt-4">Salon Quality Nails, Instantly Yours.</h2>
        <p class="text-neutral-600 mt-3 text-sm sm:text-base">Explore our stunning press-on nail collection designed for effortless elegance.</p>
    </section>

    <!-- Products -->
    <main class="max-w-6xl mx-auto px-6 pb-20">
        <h3 class="font-['Playfair_Display',serif] text-2xl font-bold text-neutral-900 mb-6">Signature Sets</h3>
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Products Loaded Here -->
        </div>
    </main>

    <!-- Cart Drawer -->
    <div id="bag-drawer" class="fixed inset-0 bg-black/50 hidden flex justify-end z-50">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between">
            <div>
                <div class="flex justify-between items-center pb-4 border-b">
                    <h4 class="font-['Playfair_Display',serif] text-xl font-bold">Your Bag</h4>
                    <button onclick="toggleBag()" class="text-xl font-bold">&times;</button>
                </div>
                <div id="bag-items" class="py-4 space-y-3 overflow-y-auto max-h-[60vh]"></div>
            </div>
            <div class="border-t pt-4 space-y-3">
                <div class="flex justify-between font-bold text-lg">
                    <span>Total:</span>
                    <span id="bag-total">Rs. 0</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-medium flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Order via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        // Uses your actual uploaded images from GitHub
        const images = ['IMG_6392.png', 'IMG_6394.png', 'IMG_6395.png', 'IMG_6396.png', 'IMG_6397.png', 'IMG_6398.png', 'IMG_6399.png', 'IMG_6418.jpeg', 'IMG_6419.jpeg'];
        const names = [
            "Peach Pink Cateye Chrome", "Velvet Burgundy Shimmer", "Midnight Black Glossy Almond",
            "Milky White French Tip", "Rose Gold Holographic", "Emerald Green Cat-Eye",
            "Latte Abstract Swirls", "Classic Red Glossy Stiletto", "Lavender Glazed Donut"
        ];

        let products = [];
        for(let i = 0; i < 9; i++) {
            products.push({
                id: i + 1,
                name: names[i],
                price: 650 + (i * 50),
                image: images[i]
            });
        }

        let bag = [];

        function renderProducts() {
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl overflow-hidden border border-[#f5dcd3] shadow-sm flex flex-col">
                    <div class="aspect-square bg-neutral-100">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4 flex flex-col flex-1 justify-between">
                        <div>
                            <h5 class="font-['Playfair_Display',serif] font-bold text-lg text-neutral-900">${p.name}</h5>
                            <p class="text-[#9c4a33] font-bold mt-1">Rs. ${p.price}</p>
                        </div>
                        <button onclick="addToBag(${p.id})" class="mt-4 w-full bg-[#9c4a33] text-white py-2.5 rounded-xl text-sm font-medium">Add to Bag</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleBag() {
            document.getElementById('bag-drawer').classList.toggle('hidden');
        }

        function addToBag(id) {
            bag.push(products.find(p => p.id === id));
            document.getElementById('bag-count').innerText = bag.length;
            updateBag();
            toggleBag();
        }

        function updateBag() {
            let total = 0;
            document.getElementById('bag-items').innerHTML = bag.map(item => {
                total += item.price;
                return `<div class="flex justify-between items-center text-sm"><span>${item.name}</span><span class="font-bold">Rs. ${item.price}</span></div>`;
            }).join('');
            document.getElementById('bag-total').innerText = `Rs. ${total}`;
        }

        function checkoutWhatsApp() {
            if(bag.length === 0) return alert("Your bag is empty!");
            let msg = "Hi! I want to order:%0A";
            let total = 0;
            bag.forEach(i => { msg += `- ${i.name} (Rs. ${i.price})%0A`; total += i.price; });
            msg += `%0ATotal: Rs. ${total}`;
            window.open(`https://wa.me/923000000000?text=${msg}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
